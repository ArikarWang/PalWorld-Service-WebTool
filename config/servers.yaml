listen: "0.0.0.0:5080"
dataDirectory: "data"
backupDirectory: "backups"
monitorIntervalSeconds: 30
# 管理工具更新源（默认 Gitee，国内直连）
# updateSource: gitee          # gitee | github | auto
# giteeOwner: arikar
# giteeRepo: pal-world-service-web-tool
# 回退 GitHub（updateSource: github/auto 时使用）
# githubOwner: ArikarWang
# githubRepo: PalWorld-Service-WebTool
# githubProxy: "https://ghfast.top/"

servers:
  - id: main
    name: 本机帕鲁服务器
    host: 127.0.0.1
    restApiPort: 8212
    gamePort: 8211
    # 帕鲁 REST API 密码（AdminPassword），不会返回给浏览器
    adminPassword: "change-me-rest"
    # 网页登录该服的密码（与 adminPassword 无关）
    webPassword: "change-me-web"
    executablePath: "C:/gameserver/steamcmd/steamapps/common/PalServer/PalServer.exe"
    configPath: "C:/gameserver/steamcmd/steamapps/common/PalServer/Pal/Saved/Config/WindowsServer/PalWorldSettings.ini"
    logDirectory: "C:/gameserver/steamcmd/steamapps/common/PalServer/Pal/Saved/Logs"
    saveDirectory: "C:/gameserver/steamcmd/steamapps/common/PalServer/Pal/Saved/SaveGames"
    # 可选：SteamCMD 路径与 AppId（用于检查更新）。通常可从 executablePath 自动推导。
    # steamCmdPath: "C:/gameserver/steamcmd/steamcmd.exe"
    # steamAppId: 2394010
