name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.1). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.version }}" -ne "") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "v0.0.${{ github.run_number }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $v"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $out = "artifacts/PalWorldService"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet publish "src/PalWorldService.Host/PalWorldService.Host.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $out
          New-Item -ItemType Directory -Path "$out/config" -Force | Out-Null
          Copy-Item "config/servers.yaml" "$out/config/servers.yaml" -Force
          Copy-Item "scripts/start.bat" "$out/start.bat" -Force
          # Do not ship placeholder secrets as "must use" — keep template only
          Compress-Archive -Path "$out\*" -DestinationPath "artifacts/PalWorldService-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalWorldService-win-x64
          path: artifacts/PalWorldService-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: PalWorld Service ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: artifacts/PalWorldService-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
