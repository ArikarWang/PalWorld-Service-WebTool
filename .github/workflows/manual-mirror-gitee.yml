name: Manual mirror to Gitee

# Emergency-only. Daily development should push directly to Gitee.
# This workflow does NOT run on push/tag — only workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main tip to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN secret missing"
            exit 1
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/arikar/pal-world-service-web-tool.git"
          git push gitee HEAD:refs/heads/main --force
          echo "Mirrored HEAD to https://gitee.com/arikar/pal-world-service-web-tool"
