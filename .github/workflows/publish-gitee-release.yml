name: Publish Gitee Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/version like v1.0.14"
        required: true
        default: "v1.0.14"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download zip from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          gh release download "$VER" \
            --repo "${{ github.repository }}" \
            --pattern "PalWorldService-win-x64.zip" \
            --dir artifacts
          ls -lh artifacts/PalWorldService-win-x64.zip

      - name: Create Gitee Release and upload zip
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN missing"
            exit 1
          fi
          OWNER=arikar
          REPO=pal-world-service-web-tool
          VER="${{ steps.ver.outputs.version }}"
          ZIP="artifacts/PalWorldService-win-x64.zip"
          API="https://gitee.com/api/v5"

          # Find or create release
          REL_JSON=$(curl -sS "$API/repos/$OWNER/$REPO/releases/tags/$VER?access_token=$GITEE_TOKEN" || true)
          REL_ID=$(python3 - <<PY
          import json,os
          raw=os.environ.get("REL_JSON") or '''$REL_JSON'''
          try:
            d=json.loads('''$REL_JSON''')
            print(d.get("id") or "")
          except Exception:
            print("")
          PY
          )

          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sS -X POST "$API/repos/$OWNER/$REPO/releases" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$VER\",\"name\":\"PalWorld Service $VER\",\"body\":\"PalWorld Service $VER\",\"target_commitish\":\"main\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          fi
          echo "Gitee release id=$REL_ID"

          # Remove old same-named attach
          curl -sS "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
            | python3 -c 'import sys,json,os; fs=json.load(sys.stdin); 
import pathlib
[print(f["id"]) for f in fs if f.get("name")=="PalWorldService-win-x64.zip"]' \
            | while read -r AID; do
                [ -n "$AID" ] || continue
                curl -sS -X DELETE "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files/$AID?access_token=$GITEE_TOKEN" >/dev/null || true
              done

          echo "Uploading zip..."
          curl -sS -f --http1.1 --connect-timeout 30 --max-time 600 \
            -F "access_token=$GITEE_TOKEN" \
            -F "release_id=$REL_ID" \
            -F "file=@${ZIP};filename=PalWorldService-win-x64.zip;type=application/zip" \
            "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files"

          echo
          echo "Done: https://gitee.com/$OWNER/$REPO/releases/$VER"
