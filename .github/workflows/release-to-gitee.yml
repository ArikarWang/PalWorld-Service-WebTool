name: Build and publish to Gitee

# Primary release path while migrating off GitHub:
# on tag push, build win-x64 zip and upload to Gitee Release.
# Users should download only from Gitee.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve version
        id: ver
        run: |
          V="${GITHUB_REF_NAME}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "num=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish win-x64 zip
        run: |
          set -euo pipefail
          OUT=artifacts/PalWorldService
          mkdir -p "$OUT/config"
          dotnet publish src/PalWorldService.Host/PalWorldService.Host.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:Version=${{ steps.ver.outputs.num }} \
            -p:InformationalVersion=${{ steps.ver.outputs.num }} \
            -o "$OUT"
          cp config/servers.yaml "$OUT/config/servers.yaml"
          cp scripts/start.bat "$OUT/start.bat"
          (cd "$OUT" && zip -qr ../PalWorldService-win-x64.zip .)
          ls -lh artifacts/PalWorldService-win-x64.zip

      - name: Sync git + upload zip to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${GITEE_TOKEN:-}"
          OWNER=arikar
          REPO=pal-world-service-web-tool
          ZIP=artifacts/PalWorldService-win-x64.zip
          API=https://gitee.com/api/v5

          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git"
          git push gitee "HEAD:refs/heads/main" --force
          git push gitee "refs/tags/${TAG}:refs/tags/${TAG}" --force

          REL_ID=$(curl -sS "$API/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$GITEE_TOKEN" \
            | python3 -c 'import sys,json
          try: print(json.load(sys.stdin).get("id") or "")
          except Exception: print("")')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sS -X POST "$API/repos/$OWNER/$REPO/releases" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"PalWorld Service $TAG\",\"body\":\"PalWorld Service $TAG\",\"target_commitish\":\"main\"}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          fi
          echo "release_id=$REL_ID"

          curl -sS "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
            | python3 -c 'import sys,json
          for f in json.load(sys.stdin):
            if f.get("name")=="PalWorldService-win-x64.zip": print(f["id"])' \
            | while read -r AID; do
                curl -sS -X DELETE "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files/$AID?access_token=$GITEE_TOKEN" >/dev/null || true
              done

          echo "Uploading to Gitee..."
          curl -sS -f --http1.1 --connect-timeout 30 --max-time 900 --retry 2 --retry-delay 8 \
            -F "access_token=$GITEE_TOKEN" \
            -F "release_id=$REL_ID" \
            -F "file=@${ZIP};filename=PalWorldService-win-x64.zip;type=application/zip" \
            "$API/repos/$OWNER/$REPO/releases/$REL_ID/attach_files"
          echo
          echo "OK https://gitee.com/$OWNER/$REPO/releases/$TAG"
