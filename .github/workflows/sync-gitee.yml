name: Sync code to Gitee

# Only mirrors git history to Gitee. Does NOT upload release zips
# (large uploads from GitHub-hosted runners to Gitee are unreliable).
#
# Important: do NOT `git push --tags --force` — that re-pushes every tag and
# re-triggers Gitee Go release pipelines for old versions (duplicate builds).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN secret missing; skip."
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/arikar/pal-world-service-web-tool.git"

          # Always mirror main tip
          git push gitee HEAD:refs/heads/main --force

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Syncing single tag: ${TAG}"
            # Create/update only this tag (no --tags blast).
            # If it already points here, push is a no-op / rejected without re-firing others.
            if ! git push gitee "refs/tags/${TAG}:refs/tags/${TAG}"; then
              echo "Tag ${TAG} already exists on Gitee or push rejected; verifying target..."
              REMOTE_SHA="$(git ls-remote gitee "refs/tags/${TAG}" | awk '{print $1}')"
              LOCAL_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
              echo "local=${LOCAL_SHA} remote_ref=${REMOTE_SHA}"
              # Annotated tags: compare peeled commit
              LOCAL_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
              REMOTE_COMMIT="$(git ls-remote --tags gitee "refs/tags/${TAG}" | awk '/\^\{\}/ {print $1; found=1} END {if (!found) print ""}')"
              if [ -n "${REMOTE_COMMIT}" ] && [ "${REMOTE_COMMIT}" = "${LOCAL_COMMIT}" ]; then
                echo "Gitee tag ${TAG} already at same commit; OK."
              elif [ "${REMOTE_SHA}" = "$(git rev-parse "refs/tags/${TAG}")" ]; then
                echo "Gitee tag ${TAG} already at same object; OK."
              else
                echo "Updating Gitee tag ${TAG} to local commit..."
                git push gitee "refs/tags/${TAG}:refs/tags/${TAG}" --force
              fi
            fi
          else
            echo "Branch push only; skipping tag sync (tags are pushed on tag events)."
          fi

          echo "Synced to https://gitee.com/arikar/pal-world-service-web-tool"
