# Gitee 流水线：推送 v* tag 自动构建并发布
# 说明：
# - plugin-24 的 build@nodejs 无 npm，改用 build@python 作壳
# - 打 tag 触发时变量常在 GITEE_BRANCH（如 v1.0.16），不一定有 GITEE_TAG
# - 打包优先 zip，其次 python/python3
#
# 本机备用：
#   $env:GITEE_TOKEN="..."
#   .\scripts\release-gitee.ps1 -Version v1.0.16

version: '1.0'
name: release-win-x64
displayName: 发布 win-x64

triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - stage: build
    displayName: 构建打包
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: build_all
        displayName: 安装工具链并打包 win-x64
        pythonVersion: 3.11.0
        commands: |
          set -eux
          echo "TAG=${GITEE_TAG:-} BRANCH=${GITEE_BRANCH:-} COMMIT=${GITEE_COMMIT:-}"
          pwd
          ls -la
          export PATH="/mnt/pipeline-tools/standard/python/3.11.0/bin:${PATH:-}"

          # ---- Node 20（npmmirror）----
          NODE_VER=20.11.0
          curl -fsSL "https://npmmirror.com/mirrors/node/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          mkdir -p "$HOME/node"
          tar -xJf /tmp/node.tar.xz -C "$HOME/node" --strip-components=1
          export PATH="$HOME/node/bin:$PATH"
          node -v
          npm -v

          # ---- 前端 ----
          cd web
          npm ci --registry=https://registry.npmmirror.com
          npm run build
          cd ..

          # ---- .NET 8 ----
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet --info

          # ---- 版本：GITEE_TAG 或 BRANCH=v* ----
          TAG_NAME="${GITEE_TAG:-}"
          case "${GITEE_BRANCH:-}" in
            v*) TAG_NAME="${TAG_NAME:-$GITEE_BRANCH}" ;;
          esac
          if [ -z "$TAG_NAME" ]; then
            VER="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/PalWorldService.Host/PalWorldService.Host.csproj | head -1)"
            TAG_NAME="v${VER}"
          else
            VER="${TAG_NAME#v}"
          fi
          echo "VERSION=$VER TAG_NAME=$TAG_NAME"
          printf '%s\n' "$TAG_NAME" > .release-tag
          printf '%s\n' "$VER" > .release-version

          mkdir -p artifacts/PalWorldService/config
          dotnet publish src/PalWorldService.Host/PalWorldService.Host.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:Version="$VER" -p:InformationalVersion="$VER" \
            -o artifacts/PalWorldService
          cp config/servers.yaml artifacts/PalWorldService/config/servers.yaml
          cp scripts/start.bat artifacts/PalWorldService/start.bat
          test -f artifacts/PalWorldService/PalWorldService.exe

          # ---- 打 zip（不依赖 python3 命令名）----
          rm -f artifacts/PalWorldService-win-x64.zip PalWorldService-win-x64.zip
          if command -v zip >/dev/null 2>&1; then
            (cd artifacts/PalWorldService && zip -qr ../PalWorldService-win-x64.zip .)
          else
            PY="$(command -v python3 || command -v python || true)"
            test -n "$PY"
            "$PY" - <<'PY'
          import shutil
          shutil.make_archive("artifacts/PalWorldService-win-x64", "zip", "artifacts/PalWorldService")
          PY
          fi
          cp artifacts/PalWorldService-win-x64.zip ./PalWorldService-win-x64.zip
          ls -lh PalWorldService-win-x64.zip .release-tag
        artifacts:
          - name: PLUGIN_RELEASE
            path:
              - PalWorldService-win-x64.zip
              - .release-tag

  - stage: release
    displayName: 发版
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        # tag 触发时 Gitee 常把 tag 放在 GITEE_BRANCH；插件若只认 GITEE_TAG，
        # 下面用 ${GITEE_BRANCH} 更贴近当前日志表现
        releaseName: PalWorld Service ${GITEE_BRANCH}
        description: PalWorld Service ${GITEE_BRANCH}
        tagName: ${GITEE_BRANCH}
        upstreamArtifact:
          - PLUGIN_RELEASE
        assertFiles:
          - PalWorldService-win-x64.zip
        prerelease: false
        allowUpdate: true
