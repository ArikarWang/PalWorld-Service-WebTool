# Gitee 新版流水线（仓库内 .workflow/*.yml，改完即生效）
# 触发：推送 tag（v 开头，如 v1.0.15）
# 作用：构建 PalWorldService-win-x64.zip → 发布到 Gitee Release 附件
#
# 若云端缺少 .NET / zip，可改用本机：
#   $env:GITEE_TOKEN="..."
#   .\scripts\release-gitee.ps1 -Version v1.0.15

version: '1.0'
name: release-win-x64
displayName: 发布 win-x64

triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - stage: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_frontend
        displayName: 构建前端
        nodeVersion: 20.11.0
        commands:
          - cd web
          - npm ci --registry=https://registry.npmmirror.com
          - npm run build
        artifacts:
          - name: WWWROOT
            path:
              - src/PalWorldService.Host/wwwroot

      - step: build@dotnet
        name: build_dotnet
        displayName: 发布 win-x64
        dependsOn: build_frontend
        commands: |
          set -e
          VER="${GITEE_TAG#v}"
          if [ -z "$VER" ]; then VER="0.0.${GITEE_PIPELINE_BUILD_NUMBER}"; fi
          mkdir -p artifacts/PalWorldService
          dotnet publish src/PalWorldService.Host/PalWorldService.Host.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:Version=$VER -p:InformationalVersion=$VER \
            -o artifacts/PalWorldService
          mkdir -p artifacts/PalWorldService/config
          cp config/servers.yaml artifacts/PalWorldService/config/servers.yaml
          cp scripts/start.bat artifacts/PalWorldService/start.bat
          (cd artifacts/PalWorldService && zip -r ../PalWorldService-win-x64.zip .)
          ls -lh artifacts/PalWorldService-win-x64.zip
        artifacts:
          - name: PLUGIN_RELEASE
            path:
              - artifacts/PalWorldService-win-x64.zip

  - stage: release
    displayName: 发版
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: PalWorld Service ${GITEE_TAG}
        description: PalWorld Service ${GITEE_TAG}
        tagName: ${GITEE_TAG}
        upstreamArtifact:
          - PLUGIN_RELEASE
        assertFiles:
          - artifacts/PalWorldService-win-x64.zip
        prerelease: false
        allowUpdate: true
